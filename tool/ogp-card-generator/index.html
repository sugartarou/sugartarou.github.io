<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGPリンク生成・デプロイツール</title>
    <!-- Tailwind CSS CDNをロード -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans JP', 'sans-serif'],
                    },
                    colors: {
                        'primary-blue': '#1DA1F2', // Twitter Blue
                    }
                }
            }
        }
    </script>
    <style>
        .container {
            max-width: 800px;
        }
        .btn-action {
            transform: scale(1);
            transition: transform 0.1s;
        }
        .btn-action:active {
            transform: scale(0.98);
        }
        .text-area-output {
            min-height: 40px;
        }
    </style>
    
    <!-- スクリプトの定義を<head>で行い、onloadから参照できるようにします -->
    <script>
        const FIXED_OWNER = 'sugartarou';
        const FIXED_REPO = 'sugartarou.github.io';
        const FIXED_BRANCH = 'gh-pages'; // デフォルトブランチ

        let finalGeneratedUrl = '';
        let finalHtmlContent = '';

        /**
         * YYYYMMDDhhmmss-R の形式で一意なファイル名を生成し、UIに設定します。
         */
        function generateUniqueFileName() {
            const now = new Date();
            const YYYY = now.getFullYear();
            const MM = String(now.getMonth() + 1).padStart(2, '0');
            const DD = String(now.getDate()).padStart(2, '0');
            const HH = String(now.getHours()).padStart(2, '0');
            const mm = String(now.getMinutes()).padStart(2, '0');
            const ss = String(now.getSeconds()).padStart(2, '0');
            const random = Math.floor(Math.random() * 9) + 1; // 1-9の通し番号

            return `redirect-${YYYY}${MM}${DD}${HH}${mm}${ss}-${random}.html`;
        }

        /**
         * ページロード時にファイル名を自動生成し、UIに設定します。
         */
        function initializeFileName() {
            // hiddenフィールドにファイル名を設定
            document.getElementById('fileName').value = generateUniqueFileName();
        }


        /**
         * 最終的な静的HTMLコンテンツと公開URLを生成します。
         * @returns {string | null} 生成されたHTML文字列、または入力エラーの場合はnull。
         */
        function generateStaticHtml() {
            const targetUrl = document.getElementById('targetUrl').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const customTitle = document.getElementById('cardTitle').value.trim(); // 新しいタイトル
            const customDescription = document.getElementById('cardDescription').value.trim(); // 新しい説明
            const fileName = document.getElementById('fileName').value.trim(); // hiddenフィールドから取得

            if (!targetUrl || !imageUrl || !fileName) {
                showModal('入力エラー', '「リンク先URL」と「表示する画像のURL」を入力してください。', 'error');
                return null;
            }

            // GitHub Pagesの公開URLを計算
            const publicBaseUrl = `https://${FIXED_OWNER}.github.io/tool/ogp-card-generator/pages/`;
            
            // 最終的なSNS共有URL (og:urlとtwitter:urlになる)
            finalGeneratedUrl = publicBaseUrl + fileName;

            // カードのタイトルと説明を簡潔な固定テキストにする
            const cardTitle = [null, undefined].includes(customTitle) ? "リダイレクト中 - 外部コンテンツ" : customTitle;
            const cardDescription = [null, undefined].includes(customDescription) ? "こちらをクリックして、詳細コンテンツへ移動してください。" : customDescription;

            // --- 静的HTMLコンテンツの生成 ---
            finalHtmlContent = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${cardTitle}</title>
    
    <!-- OGP (Discord/汎用) -->
    <meta property="og:title" content="${cardTitle}">
    <meta property="og:description" content="${cardDescription}">
    <meta property="og:image" content="${imageUrl}">
    <meta property="og:url" content="${finalGeneratedUrl}">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ja_JP">

    <!-- Twitter Card (X) -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="${cardTitle}">
    <meta name="twitter:description" content="${cardDescription}">
    <meta name="twitter:image" content="${imageUrl}">
    <meta name="twitter:url" content="${finalGeneratedUrl}">

    <script>
        // 即座にリダイレクト
        window.location.replace("${targetUrl}");
    <` + `/script>
<` + `/head>
<` + `body style="font-family: sans-serif; text-align: center; padding: 50px;">
    <` + `h1>リダイレクト中</h1>
    <` + `p>自動的に移動しない場合は、<a href="${targetUrl}">こちら</a>をクリックしてください。</p>
<` + `/body>
<` + `/html>`;

            const tweetText = `${cardTitle} ${finalGeneratedUrl}`;
            const tweetUrl = `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
            document.getElementById('tweetLink').href = tweetUrl;

            // 共有ボタンの有効化
            document.getElementById('copyUrlButton').disabled = false;
            document.getElementById('tweetLink').disabled = false;
            document.getElementById('shareGuidance').classList.add('hidden');


            return finalHtmlContent;
        }

        /**
         * GitHub Webエディタにファイルを自動入力して開きます。
         */
        function handleDeploy() {
            // HTMLコンテンツとURLを生成
            const htmlContent = generateStaticHtml();
            if (!htmlContent) return;

            const fileName = document.getElementById('fileName').value.trim();

            // GitHubの「新しいファイルを作成」URLを構築 (固定リポジトリを使用)
            // HTMLコンテンツ全体をURLエンコードして渡す
            const githubNewFileUrl = `https://github.com/${FIXED_OWNER}/${FIXED_REPO}/new/${FIXED_BRANCH}?filename=tool/ogp-card-generator/pages/${encodeURIComponent(fileName)}&value=${encodeURIComponent(htmlContent)}`;

            // ユーザーにデプロイ後のURLを通知し、GitHubを開く
            const successMessage = `
                デプロイが完了すると、以下のURLで共有できます:<br><br>
                <code class="text-sm font-mono break-all">${finalGeneratedUrl}</code><br><br>
                新しいウィンドウでGitHubが開かれますので、「Commit changes」ボタンを押してデプロイを完了させてください。
            `;
            showModal('デプロイ確認', successMessage, 'info');
            
            window.open(githubNewFileUrl, '_blank');
        }

        /**
         * 最終的な公開URLをクリップボードにコピーします。
         */
        function handleCopy() {
            // URLが未生成の場合は生成を試みる
            if (!finalGeneratedUrl) {
                if (!generateStaticHtml()) return; 
            }
            
            // クリップボードにコピー
            const textarea = document.createElement('textarea');
            textarea.value = finalGeneratedUrl;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy'); 
            document.body.removeChild(textarea);

            showCopyFeedback(document.getElementById('copyUrlButton'), 'URLをコピーしました！');
        }

        /**
         * X (Twitter) 投稿ウィンドウを開きます。
         */
        function handlePost(event) {
            // URLが未生成の場合は生成を試みる
            if (!finalGeneratedUrl) {
                if (!generateStaticHtml()) {
                    event.preventDefault();
                    return; 
                }
            }
            // generateStaticHtml()内で href は既に設定されているため、そのままリンク遷移を実行
        }

        // 以下、ユーティリティ関数（コピーフィードバック、モーダル）
        function showCopyFeedback(button, message) {
            const originalText = button.textContent;
            button.classList.remove('bg-yellow-500', 'hover:bg-yellow-600');
            button.classList.add('bg-gray-600', 'cursor-not-allowed');
            button.textContent = message;
            button.disabled = true;

            setTimeout(() => {
                button.classList.remove('bg-gray-600', 'cursor-not-allowed');
                button.classList.add('bg-yellow-500', 'hover:bg-yellow-600');
                button.textContent = originalText;
                button.disabled = false;
            }, 1500);
        }
        function showModal(title, message, type) {
            closeModal();

            const colors = {
                'error': 'bg-red-500',
                'warning': 'bg-yellow-500',
                'info': 'bg-primary-blue'
            };
            const color = colors[type] || 'bg-gray-500';

            const modalHtml = `
                <div id="customModal" class="fixed inset-0 bg-gray-600 bg-opacity-75 flex items-center justify-center z-50 p-4" onclick="closeModal()">
                    <div class="bg-white rounded-xl shadow-2xl overflow-hidden w-full max-w-sm" onclick="event.stopPropagation()">
                        <div class="${color} text-white p-4 font-bold text-lg">${title}</div>
                        <div class="p-6">
                            <p class="text-gray-700">${message}</p>
                            <button onclick="closeModal()" class="mt-6 w-full ${color} text-white font-semibold py-2 rounded-lg hover:opacity-90 transition">
                                閉じる
                            </button>
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }
        function closeModal() {
            const modal = document.getElementById('customModal');
            if (modal) {
                modal.remove();
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen py-10 px-4 font-sans" onload="initializeFileName()">

    <div class="container mx-auto p-6 bg-white shadow-xl rounded-2xl border border-gray-100">
        <h1 class="text-3xl font-bold text-gray-800 mb-6 border-b pb-3">
            🚀 OGP/カードリンク自動デプロイ支援ツール
        </h1>
        <p class="text-gray-700 mb-6">
            リンク設定を入力後、「GitHubにデプロイ」ボタンを押してリンクファイルを生成・コミットしてください。
        </p>

        <form id="generator-form" class="space-y-6" onsubmit="event.preventDefault(); return false;">
            
            <!-- リンクしたいURL入力欄 (ターゲットURL) -->
            <div class="input-group">
                <label for="targetUrl" class="block text-sm font-medium text-gray-700 mb-1">
                    リンク先URL
                </label>
                <input type="url" id="targetUrl" placeholder="例: https://example.com/hogehoge" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
            </div>

            <!-- カードに表示するタイトル -->
            <div class="input-group">
                <label for="cardTitle" class="block text-sm font-medium text-gray-700 mb-1">
                    表示するタイトル
                </label>
                <input type="text" id="cardTitle" placeholder="例: おすすめの本" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
            </div>

            <!-- カードに表示する説明文 -->
            <div class="input-group">
                <label for="cardDescription" class="block text-sm font-medium text-gray-700 mb-1">
                    表示する説明文
                </label>
                <input type="text" id="cardDescription" placeholder="例: ミステリー好きにおすすめ！" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
            </div>

            
            <!-- カードに表示する画像URL入力欄 -->
            <div class="input-group">
                <label for="imageUrl" class="block text-sm font-medium text-gray-700 mb-1">
                    表示する画像のURL
                </label>
                <input type="url" id="imageUrl" placeholder="例: https://example.com/cover.jpg" required class="w-full p-3 border border-gray-300 rounded-lg focus:ring-primary-blue focus:border-primary-blue transition duration-150">
            </div>

            <!-- デプロイ設定 (内部処理用) - 完全に非表示 -->
            <div hidden>
                <input type="text" id="fileName" readonly>
            </div>

            <!-- デプロイボタン -->
            <button onclick="handleDeploy()" class="w-full bg-green-600 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-green-700 transition duration-200 btn-action text-lg">
                🚀 GitHubにデプロイ (新しいファイルを作成)
            </button>
            
            <div class="pt-4 border-t border-gray-200 mt-6 space-y-4">
                
                <div class="flex flex-wrap md:flex-nowrap gap-4">
                    <button onclick="handleCopy()" id="copyUrlButton" class="w-full md:w-auto flex-1 bg-yellow-500 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-yellow-600 transition duration-200 btn-action" disabled>
                        URLをコピーする
                    </button>
                    <a id="tweetLink" href="#" target="_blank" onclick="handlePost(event)" class="w-full md:w-auto flex-1 text-center bg-gray-800 text-white font-semibold py-3 rounded-xl shadow-md hover:bg-black transition duration-200 flex items-center justify-center btn-action" disabled>
                        <svg fill="currentColor" viewBox="0 0 24 24" class="w-5 h-5 mr-2">
                            <path d="M18.9 1.5l-6.5 7.8L5 1.5H3.1l8.5 12L3.1 22.5h1.9l6.5-7.8L19 22.5h1.9l-8.5-12 8.5-10.8zM6.9 3.5h.7L17.2 20.5h-.7L6.9 3.5z"/>
                        </svg>
                        Xでポストする
                    </a>
                </div>
                <p id="shareGuidance" class="text-sm text-red-500 mt-3 hidden">
                    ※ デプロイが完了したら、生成されたURLで共有アクションが実行可能になります。
                </p>
            </div>

        </form>
    </div>
</body>
</html>
